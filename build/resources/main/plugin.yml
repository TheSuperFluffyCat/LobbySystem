name: FluffyLobby
version: '1.7.6'
main: lobby.fluffylobby.FluffyLobby
api-version: '1.21'
softdepend:
  - PlaceholderAPI
commands:
  build:
    description: Toggles build mode on or off
    usage: /build
    permission: lobby.build
  fluffylobby:
    description: Lobby managers commands
    permission: lobby.manage
  setspawn:
    description: Set the spawn point
    usage: /setspawn
    permission: lobby.setspawn
  spawn:
    description: Teleport to the spawn point
    usage: /spawn
  fly:
    description: Toggle flight mode
    usage: /fly
    permission: fluffylobby.fly
  vanish:
    description: Toggle vanish mode
    usage: /vanish
    permission: fluffylobby.vanish
  clearchat:
    description: Clear chat for all players
    usage: /clearchat
    permission: fluffylobby.clearchat
permissions:
  lobby.build:
    default: op
  lobby.build.others:
    default: op
  fluffylobby.fly:
    default: op
  fluffylobby.vanish:
    default: op
  fluffylobby.clearchat:
    default: op
